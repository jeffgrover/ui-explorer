<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Explorer Smoke App</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 2rem;
        max-width: 760px;
      }

      nav {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1.5rem;
      }

      button, a {
        font: inherit;
      }

      .toast {
        background: #ffe8e8;
        border: 1px solid #d33;
        padding: 0.75rem;
        margin-top: 1rem;
      }
    </style>
  </head>
  <body>
    <nav>
      <a href="/index.html">Home</a>
      <a href="/reports.html">Reports</a>
      <button id="details">Open details</button>
      <button>Delete account</button>
    </nav>

    <main>
      <h1>Explorer Smoke App</h1>
      <p>This page exists to verify the explorer can inventory links and controls.</p>
      <section id="panel" hidden>
        <h2>Details</h2>
        <p class="toast">Error loading optional widget.</p>
      </section>
    </main>

    <script>
      document.querySelector("#details").addEventListener("click", () => {
        document.querySelector("#panel").hidden = false;
        console.error("Smoke-test console error");
      });
    </script>
  </body>
</html>
