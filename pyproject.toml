[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ui-explorer"
version = "0.1.0"
description = "A headed-only Playwright explorer for unknown web apps and SPAs."
requires-python = ">=3.11"
dependencies = [
  "playwright>=1.45",
]

[project.scripts]
ui-explorer = "ui_explorer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
